proxies:
  - name: Exit-HY2
    type: hysteria2
    server: "<SERVER_IP>"
    port: 443
    password: "<HY2_PASSWORD>"
    sni: "<SERVER_IP>"
    skip-cert-verify: true
    fingerprint: "<HY2_CERT_SHA256_HEX64>"
    alpn:
      - h3

  - name: Exit-VLESS
    type: vless
    server: "<SERVER_IP>"
    port: 443
    uuid: "<DESKTOP_UUID>"
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: "<REALITY_SNI>"
    client-fingerprint: chrome
    reality-opts:
      public-key: "<REALITY_PUBLIC_KEY>"
      short-id: "<REALITY_SHORT_ID>"

proxy-groups:
  - name: FIXED-EXIT
    type: select
    proxies:
      - Exit-HY2
      - Exit-VLESS

