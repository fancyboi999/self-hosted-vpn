# Mobile-only rules, placed ahead of the shared template rules when rendering shadowrocket.conf.
# Desktop clients cover the same ground with CLI environment variables and browser settings.

# Telemetry and crash-report ingestion endpoints. An iOS app has no DISABLE_TELEMETRY switch,
# and these uploads carry device timezone, locale, and carrier. Only ingestion hosts are
# rejected; the sentry.io console and Statsig feature gates stay reachable.
DOMAIN-SUFFIX,ingest.sentry.io,REJECT
DOMAIN-SUFFIX,ingest.us.sentry.io,REJECT
DOMAIN-SUFFIX,ingest.de.sentry.io,REJECT
DOMAIN-SUFFIX,browser-intake-datadoghq.com,REJECT
DOMAIN-SUFFIX,segment.io,REJECT
DOMAIN-SUFFIX,segment.com,REJECT

# Claude / Anthropic: every host on the slot.
DOMAIN-SUFFIX,claude.ai,PROXY
DOMAIN-SUFFIX,claude.com,PROXY
DOMAIN-SUFFIX,anthropic.com,PROXY
DOMAIN-SUFFIX,claudeusercontent.com,PROXY
DOMAIN-SUFFIX,clau.de,PROXY
DOMAIN-KEYWORD,anthropic,PROXY
DOMAIN-KEYWORD,claude,PROXY

# In-app purchase, captcha, OAuth, payment, and feature-gate hosts share the slot.
# The Apple Pay hosts must precede the template's apple.com DIRECT rule.
DOMAIN,pay.apple.com,PROXY
DOMAIN,paymentrelayservice.apple.com,PROXY
DOMAIN-SUFFIX,statsig.com,PROXY
DOMAIN-SUFFIX,statsigapi.net,PROXY
DOMAIN-SUFFIX,featuregates.org,PROXY
DOMAIN-SUFFIX,prodregistryv2.org,PROXY
DOMAIN-SUFFIX,challenges.cloudflare.com,PROXY
DOMAIN-SUFFIX,auth0.com,PROXY
DOMAIN-SUFFIX,arkoselabs.com,PROXY
DOMAIN-SUFFIX,stripe.com,PROXY
DOMAIN-SUFFIX,stripe.network,PROXY
DOMAIN-SUFFIX,stripecdn.com,PROXY
DOMAIN-SUFFIX,intercom.io,PROXY
DOMAIN-SUFFIX,intercomcdn.com,PROXY

# WebRTC STUN through the slot, so the browser's WebRTC-visible IP matches the HTTPS exit.
